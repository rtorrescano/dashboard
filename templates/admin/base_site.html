{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | Administración de Salud{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <!-- Framework GOB.mx -->
    <link href="https://framework-gb.cdn.gob.mx/gm/v4/css/main.css" rel="stylesheet">
    <style>
        /* Sobrescribir colores de Django Admin con los de GOB.mx */
        :root {
            --primary: #611232; /* Guinda */
            --secondary: #10312B; /* Verde */
            --accent: #BC955C; /* Dorado */
        }
        #header { background: #611232; color: white; }
        #branding h1 { color: white; font-weight: bold; }
        div.breadcrumbs { background: #10312B; color: white; }
        .button, input[type=submit], input[type=button] { background: #10312B; }
    </style>
{% endblock %}

{% block branding %}
    <h1 id="site-name"><a href="{% url 'admin:index' %}" style="color:white;">SALUD | Administración</a></h1>
{% endblock %}

{% block nav-global %}{% endblock %}

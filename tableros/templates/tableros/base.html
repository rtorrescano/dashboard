<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Información - Secretaría de Salud{% endblock %}</title>

    <!-- Framework GOB.mx v4 -->
    <link href="https://framework-gb.cdn.gob.mx/gm/v4/image/favicon.ico" rel="shortcut icon">
    <link href="https://framework-gb.cdn.gob.mx/gm/v4/css/main.css" rel="stylesheet">
    
    <!-- CSS Extra (Mapas, Gráficas) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Bloque para CSS personalizado de las vistas -->
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Barra de navegación superior institucional -->
    <!--nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/" style="font-weight: bold; letter-spacing: 1px;">
                SALUD <span style="font-weight: 300; font-size: 0.8em; margin-left: 10px;">| Tablero de Mortalidad Materna</span>
            </a>
        </div>
    </nav-->

    <!-- Contenido de la página -->
    <main class="page" style="min-height: 80vh;">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Institucional -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 Secretaría de Salud. Datos Abiertos.</p>
        </div>
    </footer>

    <!-- Librerías JS Globales -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Framework GOB.mx -->
    <script src="https://framework-gb.cdn.gob.mx/gm/v4/js/gobmx.js"></script>

    <!-- Bloque para JS personalizado de las vistas -->
    {% block extra_js %}{% endblock %}
</body>
</html>
